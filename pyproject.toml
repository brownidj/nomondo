[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beneede"
version = "0.1.0"
description = "A world of restaurant discoveries, collected in one place."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2,<3", "pydantic>=2,<3", "phonenumbers>=9,<10", "psutil>=7,<8"]

[tool.setuptools]
py-modules = ["beneede", "main", "restaurant_server", "phone_numbers", "country_names", "city_index", "website_status", "consolidate_duplicates", "restaurant_edits", "restaurant_lookup", "restaurant_additions", "restaurant_reviews", "restaurant_names", "mobile_connection"]
